<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公开处刑</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#fff8ef;color:#2b2b2b;
       font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;justify-content:center;padding:24px}
  .card{width:420px;max-width:100%;background:#fff;border-radius:18px;
        overflow:hidden;box-shadow:0 10px 30px rgba(228,0,43,.18)}
  .hd{background:#E4002B;color:#fff;padding:16px 20px;display:flex;
      align-items:center;gap:10px}
  .hd h1{font-size:18px;margin:0;font-weight:800}
  .bd{padding:20px}
  .kicker{color:#E4002B;font-weight:800;font-size:13px;letter-spacing:1px}
  .big{font-size:30px;font-weight:900;margin:6px 0}
  .row{display:flex;justify-content:space-between;padding:7px 0;
       border-bottom:1px dashed #f0d9c2;font-size:14px}
  .row:last-child{border-bottom:none}
  .bar{height:14px;border-radius:8px;background:#ffe6c2;overflow:hidden;margin:10px 0}
  .bar>i{display:block;height:100%;background:#E4002B}
  .taunt{background:#fff8ef;border-left:4px solid #FFC72C;padding:10px 12px;
         border-radius:8px;margin:8px 0;font-size:13px;font-style:italic}
  .foot{padding:12px 20px;background:#fff8ef;color:#9a7b5f;font-size:12px;
        text-align:center}
  .pill{display:inline-block;background:#FFC72C;color:#5a3b00;font-weight:800;
        border-radius:999px;padding:2px 10px;font-size:12px}
  .mt{margin-top:14px}
</style></head><body><div class="card">
      <div class="hd" style="background:#5a3b00"><svg viewBox="0 0 64 56" width="34" height="30" aria-hidden="true">
      <path d="M14 54 V30 a10 10 0 0 1 20 0 V54" fill="none" stroke="#FFC72C" stroke-width="9" stroke-linecap="round"/>
      <path d="M30 54 V30 a10 10 0 0 1 20 0 V54" fill="none" stroke="#FFC72C" stroke-width="9" stroke-linecap="round"/>
    </svg><h1>💀 公开处刑</h1></div>
      <div class="bd">
        <div class="big" style="color:#5a3b00">你输给了 7 天前的自己</div>
        <p style="font-size:14px">赌约 5 张清零，你只清了 3 张。</p>
        <div class="row"><span>白扔</span><span><b>¥28.00</b></span></div>
        <div class="row"><span>等于</span><span>一顿麦当劳正餐</span></div>
        <div class="mt"><div class="kicker">债务山</div>
          <div style="display:flex;align-items:flex-end;height:130px;margin-top:6px"><div style="width:100%;height:66px;background:#E4002B;border-radius:4px 4px 0 0;margin:0 2px"></div><div style="width:100%;height:120px;background:#E4002B;border-radius:4px 4px 0 0;margin:0 2px"></div></div>
        </div>
        <div class="mt"><div class="kicker">过期未用的券</div><div class="row"><span>薯条买一送一</span><span>¥10.0</span></div><div class="row"><span>巧克力味厚松饼猪柳蛋套餐</span><span>¥18.0</span></div></div>
        <p style="font-size:12px;color:#9a7b5f;margin-top:12px">本金 ¥64.90 归零。下次别高估自己的执行力。</p>
      </div>
      <div class="foot">麦麦对赌 2.0</div></div></body></html>
